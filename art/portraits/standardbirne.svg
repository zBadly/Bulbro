<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Porträt standardbirne (erzeugt von tools/make_portraits.py, nicht von Hand ändern) -->
  <defs><radialGradient id="p-glow"><stop offset="0" stop-color="#FFE066" stop-opacity="0.55"/><stop offset="0.7" stop-color="#FFE066" stop-opacity="0.12"/><stop offset="1" stop-color="#FFE066" stop-opacity="0"/></radialGradient></defs>
  <circle cx="64.0" cy="64.0" r="60.0" fill="#1B1B24"/>
  <circle cx="64.0" cy="64.0" r="60.0" fill="url(#p-glow)"/>
  <circle cx="64.0" cy="64.0" r="60.0" fill="none" stroke="#FFE066" stroke-width="3" stroke-opacity="0.8"/>
  <circle cx="64.0" cy="64.0" r="62.0" fill="none" stroke="#2A1E2E" stroke-width="2"/>
  <g transform="translate(19.0,6.0) scale(1.25)">
  <defs>
    <path id="s-glass" d="M24,66 C24,58 8,51 8,34 A28,28 0 0 1 64,34 C64,51 48,58 48,66 Z"/>
    <clipPath id="s-glass-clip"><use href="#s-glass"/></clipPath>
    <rect id="s-base" x="22" y="63" width="28" height="22" rx="5"/>
    <clipPath id="s-base-clip"><use href="#s-base"/></clipPath>
  </defs>

  <!-- Kontaktspitze -->
  <rect x="29" y="82" width="14" height="9" rx="4" fill="#5A5F66" stroke="#2A1E2E" stroke-width="4" stroke-linejoin="round"/>

  <!-- Schraubsockel -->
  <use href="#s-base" fill="#6F757C"/>
  <rect x="18" y="59" width="28" height="22" rx="5" fill="#9AA0A6" clip-path="url(#s-base-clip)"/>
  <rect x="25" y="66" width="5" height="16" rx="2.5" fill="#C9CED3"/>
  <g stroke="#2A1E2E" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M23,71 Q36,74 49,71"/>
    <path d="M23,78 Q36,81 49,78"/>
  </g>
  <use href="#s-base" fill="none" stroke="#2A1E2E" stroke-width="4" stroke-linejoin="round"/>

  <!-- Glaskolben -->
  <use href="#s-glass" fill="#F2B83A"/>
  <ellipse cx="32" cy="31" rx="29" ry="30" fill="#FFE066" clip-path="url(#s-glass-clip)"/>
  <ellipse cx="20" cy="18" rx="7" ry="4.5" fill="#FFFFFF" transform="rotate(-40 20 18)"/>
  <circle cx="14" cy="29" r="2.5" fill="#FFFFFF"/>
  <use href="#s-glass" fill="none" stroke="#2A1E2E" stroke-width="4" stroke-linejoin="round"/>

  <!-- Gesicht -->
  <ellipse cx="18" cy="45" rx="5" ry="3" fill="#FF9E7A" opacity="0.6"/>
  <ellipse cx="54" cy="45" rx="5" ry="3" fill="#FF9E7A" opacity="0.6"/>
  <ellipse cx="27" cy="35" rx="6" ry="8.5" fill="#2A1E2E"/>
  <ellipse cx="45" cy="35" rx="6" ry="8.5" fill="#2A1E2E"/>
  <circle cx="29" cy="31" r="2.4" fill="#FFFFFF"/>
  <circle cx="47" cy="31" r="2.4" fill="#FFFFFF"/>
  <path d="M31,47 Q36,52 41,47" fill="none" stroke="#2A1E2E" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
