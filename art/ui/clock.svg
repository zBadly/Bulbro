<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <clipPath id="face-clip">
      <circle cx="16" cy="17" r="11.5"/>
    </clipPath>
  </defs>
  <!-- Krone und Knöpfe oben -->
  <rect x="13" y="2.5" width="6" height="4" rx="1.5" fill="#9AA0A6" stroke="#2A1E2E" stroke-width="3" stroke-linejoin="round"/>
  <!-- Gehäuse: Schatten, Grundton nach oben links versetzt, Glanz -->
  <circle cx="16" cy="17" r="11.5" fill="#6F757C"/>
  <g clip-path="url(#face-clip)">
    <circle cx="14.5" cy="15.5" r="11.5" fill="#9AA0A6"/>
  </g>
  <!-- Zifferblatt -->
  <circle cx="16" cy="17" r="8" fill="#F4F0EA"/>
  <ellipse cx="13" cy="13.5" rx="2.6" ry="1.5" fill="#FFFFFF" transform="rotate(-35 13 13.5)"/>
  <!-- Zeiger -->
  <path d="M16 17 V11.5 M16 17 L19.5 19" fill="none" stroke="#2A1E2E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="16" cy="17" r="1.6" fill="#2A1E2E"/>
  <!-- Kontur zuletzt -->
  <circle cx="16" cy="17" r="11.5" fill="none" stroke="#2A1E2E" stroke-width="3"/>
</svg>
