<svg xmlns="http://www.w3.org/2000/svg" width="60" height="56" viewBox="0 0 60 56">
  <defs>
    <ellipse id="shell" cx="30" cy="33" rx="22" ry="17"/>
    <clipPath id="shell-clip"><use href="#shell"/></clipPath>
  </defs>

  <!-- Beinchen -->
  <g stroke="#2A1E2E" stroke-width="3.5" stroke-linecap="round">
    <path d="M12,40 L6,47 M20,46 L16,53 M48,40 L54,47 M40,46 L44,53"/>
  </g>

  <!-- Horn (Akzent Türkis = Sprinter) -->
  <path d="M30,4 C35,9 37,15 36,21 L24,21 C23,15 25,9 30,4 Z" fill="#4FC1B5" stroke="#2A1E2E" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M30,7 C28,11 27,15 27,19" fill="none" stroke="#A8EDE5" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Panzer -->
  <use href="#shell" fill="#3A2A5C"/>
  <ellipse cx="27" cy="30" rx="22" ry="17" fill="#5B3F8C" clip-path="url(#shell-clip)"/>
  <path d="M30,17 L30,49" stroke="#3A2A5C" stroke-width="2.5"/>
  <ellipse cx="18" cy="24" rx="5" ry="3" fill="#8A6BC0" transform="rotate(-30 18 24)"/>
  <use href="#shell" fill="none" stroke="#2A1E2E" stroke-width="4"/>

  <!-- Stirnplatte mit Augen -->
  <path d="M15,26 Q30,16 45,26 L43,32 Q30,26 17,32 Z" fill="#4FC1B5" stroke="#2A1E2E" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="23" cy="32" rx="4" ry="4.5" fill="#F7F0FF"/>
  <ellipse cx="37" cy="32" rx="4" ry="4.5" fill="#F7F0FF"/>
  <circle cx="23.5" cy="33" r="2" fill="#2A1E2E"/>
  <circle cx="36.5" cy="33" r="2" fill="#2A1E2E"/>
</svg>
