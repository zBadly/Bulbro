<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <rect id="stick" x="20" y="6" width="8" height="38" rx="4"/>
    <clipPath id="stick-clip"><use href="#stick"/></clipPath>
  </defs>
  <g transform="rotate(40 24 24)" stroke-linejoin="round" stroke-linecap="round">
    <!-- Zweig mit Blatt -->
    <path d="M22,20 L16,14" stroke="#2A1E2E" stroke-width="8"/>
    <path d="M22,20 L16,14" stroke="#9C6B3F" stroke-width="3.5"/>
    <ellipse cx="13" cy="11" rx="6.5" ry="4.2" fill="#7ED957" stroke="#2A1E2E" stroke-width="3" transform="rotate(35 13 11)"/>
    <!-- Stock -->
    <use href="#stick" fill="#734B28"/>
    <rect x="19" y="6" width="6" height="38" fill="#9C6B3F" clip-path="url(#stick-clip)"/>
    <rect x="21" y="9" width="2" height="12" rx="1" fill="#C08A57"/>
    <ellipse cx="24" cy="30" rx="2" ry="1.4" fill="#734B28"/>
